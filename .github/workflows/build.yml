name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show repository structure
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== APP ====="
          ls -la app/ 2>/dev/null || echo "MISSING app/ FOLDER"
          echo "===== KOTLIN FILES ====="
          find . -name "*.kt" -not -path "./build/*" || echo "NO .kt FILES"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found — generating wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ls -la gradlew gradle/wrapper/

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PoolCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
